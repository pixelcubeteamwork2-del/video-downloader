# Builds the desktop app for Windows and macOS on GitHub's machines (no Mac needed).
# Run it from the repository's Actions tab ("Build desktop apps" > Run workflow), or push a
# tag like v1.2.0. The zips appear under the run's "Artifacts" (and on the release, for tags).
name: Build desktop apps

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: write   # only used to attach the zips to a release when a v* tag is pushed

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Build
        shell: pwsh
        run: ./desktop/build.ps1
      - name: Rename zip
        shell: pwsh
        run: Move-Item "dist/Video Downloader.zip" "dist/Video-Downloader-windows-x64.zip"
      - name: Test the app from its zip (as a user would get it)
        shell: pwsh
        run: |
          Expand-Archive "dist/Video-Downloader-windows-x64.zip" -DestinationPath "$env:RUNNER_TEMP/install"
          python desktop/smoke_test.py "$env:RUNNER_TEMP/install/Video Downloader/Video Downloader.exe"
      - uses: actions/upload-artifact@v4
        with:
          name: Video-Downloader-windows-x64
          path: dist/Video-Downloader-windows-x64.zip

  mac:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-latest       # Apple Silicon (M1/M2/M3/M4)
            arch: arm64
          - runner: macos-15-intel     # Intel Macs
            arch: x86_64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Build
        run: PYTHON=python bash desktop/build_mac.sh
      - name: Test the app from its zip (as a user would get it)
        run: |
          mkdir -p "$RUNNER_TEMP/Applications"
          ditto -x -k "dist/Video-Downloader-mac-${{ matrix.arch }}.zip" "$RUNNER_TEMP/Applications"
          APP="$RUNNER_TEMP/Applications/Video Downloader.app"
          codesign --verify --deep --strict "$APP" && echo "signature: valid"
          file "$APP/Contents/MacOS/Video Downloader" "$APP/Contents/Frameworks/ffmpeg" "$APP/Contents/Frameworks/deno" || true
          build/venv-mac/bin/python desktop/smoke_test.py "$APP/Contents/MacOS/Video Downloader"
      - name: Launch test (opens the app window in Chrome, then closes it)
        run: |
          APP="$RUNNER_TEMP/Applications/Video Downloader.app"
          "$APP/Contents/MacOS/Video Downloader" > "$RUNNER_TEMP/launch.log" 2>&1 &
          PID=$!
          for i in $(seq 1 40); do curl -sf -o /dev/null http://127.0.0.1:5757/ && break; sleep 1; done
          curl -sf -o /dev/null http://127.0.0.1:5757/download && echo "server: answering on port 5757"
          PROFILE="$HOME/Library/Application Support/Video Downloader/window"
          for i in $(seq 1 30); do [ -L "$PROFILE/SingletonLock" ] && break; sleep 1; done
          ls -la "$PROFILE/SingletonLock" && echo "app window: open"
          pkill -f -- "--user-data-dir=$PROFILE" || true    # close the app window
          for i in $(seq 1 20); do kill -0 $PID 2>/dev/null || break; sleep 1; done
          if kill -0 $PID 2>/dev/null; then
            echo "FAILED: the app kept running after its window closed"; cat "$RUNNER_TEMP/launch.log"; kill $PID; exit 1
          fi
          echo "app quit after its window closed: OK"
      - name: Test the .dmg (open it and run the app from it)
        run: |
          DMG="dist/Video-Downloader-mac-${{ matrix.arch }}.dmg"
          hdiutil verify "$DMG"
          MNT=$(hdiutil attach -nobrowse -readonly "$DMG" | awk -F'\t' '/\/Volumes\//{print $NF}')
          echo "mounted at: $MNT"; ls -la "$MNT"
          test -L "$MNT/Applications" && echo "Applications shortcut: OK"
          codesign --verify --deep --strict "$MNT/Video Downloader.app" && echo "signature: valid"
          "$MNT/Video Downloader.app/Contents/MacOS/Video Downloader" --self-test
          hdiutil detach "$MNT"
      - uses: actions/upload-artifact@v4
        with:
          name: Video-Downloader-mac-${{ matrix.arch }}
          path: |
            dist/Video-Downloader-mac-${{ matrix.arch }}.dmg
            dist/Video-Downloader-mac-${{ matrix.arch }}.zip

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [windows, mac]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            out/*.zip
            out/*.dmg
