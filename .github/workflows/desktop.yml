# Builds the desktop app for Windows and macOS on GitHub's machines (no Mac needed).
# Run it from the repository's Actions tab ("Build desktop apps" > Run workflow), or push a
# tag like v1.2.0. The zips appear under the run's "Artifacts" (and on the release, for tags).
name: Build desktop apps

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: write   # only used to attach the zips to a release when a v* tag is pushed

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Build
        shell: pwsh
        run: ./desktop/build.ps1
      - name: Rename zip
        shell: pwsh
        run: Move-Item "dist/Video Downloader.zip" "dist/Video-Downloader-windows-x64.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: Video-Downloader-windows-x64
          path: dist/Video-Downloader-windows-x64.zip

  mac:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-latest       # Apple Silicon (M1/M2/M3/M4)
            arch: arm64
          - runner: macos-15-intel     # Intel Macs
            arch: x86_64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Build
        run: PYTHON=python bash desktop/build_mac.sh
      - uses: actions/upload-artifact@v4
        with:
          name: Video-Downloader-mac-${{ matrix.arch }}
          path: dist/Video-Downloader-mac-${{ matrix.arch }}.zip

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [windows, mac]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: out/*.zip
