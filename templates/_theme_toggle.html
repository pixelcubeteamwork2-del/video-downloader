        <button type="button" id="theme-toggle" class="icon-btn theme-toggle" title="Switch light / dark theme" aria-label="Switch light / dark theme">
          <svg class="icon moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z"/></svg>
          <svg class="icon sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2.5v2M12 19.5v2M4.6 4.6l1.4 1.4M18 18l1.4 1.4M2.5 12h2M19.5 12h2M4.6 19.4 6 18M18 6l1.4-1.4"/></svg>
        </button>
        <script>
          (function () {
            var btn = document.getElementById("theme-toggle");
            btn.addEventListener("click", function () {
              var next = document.documentElement.getAttribute("data-theme") === "dark" ? "light" : "dark";
              document.documentElement.setAttribute("data-theme", next);
              try { localStorage.setItem("theme", next); } catch (e) {}
            });
          })();
        </script>
